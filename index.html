<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <nav class="container">
        <h3 class="logo"><a href="./index.html">Users</a></h3>

        <div class="links">
          <a class="link" href="">Student</a>
          <a class="link" href="">Users</a>
        </div>
      </nav>
    </header>

    <main>
     
      <div class="container" style="margin-top: 20px; display: flex; justify-content: flex-end;">
        <button id="add-user-btn" class="add-btn">+ Foydalanuvchi qo'shish</button>
      </div>

      
      <section class="users-wrapper">
        <div class="container users-container">
      
        </div>
      </section>

  
      <div id="modal" class="modal hidden">
        <div class="modal-content">
         
          <button id="close-modal-x" class="close-x">×</button>
          
          <h2>Yangi foydalanuvchi</h2>
          <form id="add-user-form">
            <input type="text" id="name" placeholder="Ism va familiya" required />
            <input type="email" id="email" placeholder="Email" required />
            <select id="role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
              <option value="moderator">Moderator</option>
            </select>
            <div class="modal-actions">
              <button type="button" id="close-modal">Bekor qilish</button>
              <button type="submit" class="save-btn">Saqlash</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
